<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de IMC</h1>
        <form id="imcForm">
            <div class="input-group">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" name="peso" required step="0.1" min="1">
            </div>
            <div class="input-group">
                <label for="altura">Altura (m):</label>
                <input type="number" id="altura" name="altura" required step="0.01" min="0.1">
            </div>
            <button type="submit">Calcular IMC</button>
        </form>
        <h2 id="resultado"></h2>
        <div id="imagen-imc-container">
            <img id="imagenIMC" src="" alt="Representación del IMC" style="display: none;">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
